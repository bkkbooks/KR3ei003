body:
  text: 白蒲嶺張氏女科唐時開通年間有一神人借宿於慈邑張氏家次日將書付張氏之婦開卷視之乃女科也初以調經其法和氣血均寒熱而世無不育之婦次以胎前其法補氣血清痰火凡有諸症必先安胎為主次以胎前産後其前後不同此書數百年來隱而不發今豫得之醫論十三篇而無遺症胎前産後各各辨明與諸家用藥大有不同傳與當世醫者庶免婦女之大難得此書者當存好生之心勿祕可也廣嗣論凡少婦不受孕者無他多因氣血不調寒熱不均有氣盛而血虛者氣血流通遍走四肢使血不得積聚於子宮子宮枯燥往來易感陽氣不能成胎大宜補血使血與氣相配孕斯成矣大凡氣盛血衰者其月水多不應期而至或數月一至或期年一至醫者慎不作血隔看大宜補血慎勿破血有血盛而氣衰者血不能自行隨氣而動氣衰不運多積於子宮滿則溢也其月水不月而至今呼為敗慎勿用養血之劑蓋養血之藥又能活血補之非徒無益而病反加劇矣宜重用參朮補氣使氣能配血則病可愈而孕可懷也有熱勝者其月水必先期而至如大熱者其腹大痛微熱者其腹微痛慎勿作寒痛看雖易入陽氣豈能懷孕乎當服寒涼之劑以調之有寒勝者必月水後期而至其腹不礙痛若精氣不能易入豈能久存於腹宜服溫暖之藥以調之氣血既平寒熱既和則無不孕矣胎前論凡孕婦諸症別無他故因受胎之後氣血有方不能滋養其胎而母病至矣氣血既虛使胎不安於母腹須大補氣血則胎自安有胎動而母病者安其胎母病愈蓋胎前患病以安胎辦主若胎孕一動病必難治醫須慎之産後論夫産後之患多起於風寒飲食之間其餘則血氣為患夏月之病多因於風冬月之病多因於寒惟飲食之患無定時也蓋易産之後其病易治難産之後其病難治難産必深感風寒兼氣血極虛雖略進飲食力不能勝亦為之患也産後諸症多類傷寒莫作傷寒治之更莫作雜症治之此乃女科不傳之訣醫者切莫狐疑其治法前後不同二十日前氣血未定惡露未盡當破血為主二十日外氣血已定各歸經絡雖有惡露驅逐不行凡有諸症要補氣血更兼活血諸書以月外作雜症治之其言謬矣婦人月水經水或一二月一至或期年一至不甚瘦弱者此氣盛血衰也慎勿作血隔治當補血為主當歸三錢川芎二錢芍藥生地丹參玄胡小茴牛膝蘇梗圓眼肉各一錢婦人如同前病身體瘦弱或發寒熱此氣血兩虛血枯經閉宜大補氣血為主人參五分茯苓白朮歸身芍藥圓眼肉各二錢沙參丹參生地木通各一錢婦人敗血不日而至此非敗血氣虛故也宜補氣為主人參五分甘草五分白朮黃耆茯苓阿膠各二錢木通八分婦人月水先期而至小腹作痛氣血兩熱故也當理氣清火為主延胡索甘草各三錢黃耆山楂撫芎各二錢芍藥蘇梗丹皮木通香附各一錢婦人月水後期而至此氣血虛寒故也川芎當歸艾葉香附紅花各二錢桂枝黑姜各五分玄胡索木通各一錢種子方紅花桃仁玄胡香附各二錢小茴枳殼牛膝各一錢山楂三十粒莪朮八分官桂三分如月水先期而至加黃芩二錢如後期而至加酒炮姜五分先期而至血若紫色黑色成塊者血熱故也加黃芩黃連荊芥必不可少後期而至血色淡紅者痰多血少故也又兼寒生地二陳湯加黑姜煎服妙胎前諸症婦人胎氣不固常要小産人參五分加條芩殼砂杜仲川斷糯米一撮炒孕婦因跌撞壓觸腹痛血下胎動川芎黃芩芍藥各三錢當歸熟地杜仲各一錢殼砂川斷各二錢阿膠一錢胎動下血其腹絞痛不知兒身死活川芎六錢當歸三錢水酒煎作三次服胎活即安胎死即下婦人下血不止胎上衝心四肢逆冷幾死阿膠杜仲各三錢條芩三錢川芎三錢熟艾桔梗各二錢陳皮竹葉各二錢妊婦小腹沉重痛不可忍二便閉塞不通名胎壓膀胱升麻川芎條芩杜仲山藥川斷各二錢人參五分黃連茯苓各一錢白朮土炒二錢孕婦胎孕上衝痛不可忍此為子懸血虛故也大宜補血為主四物湯加條芩殼砂桔梗陳皮胎孕不安因氣血不足血虛則隨氣上升大宜補血為主氣虛隨血下墜大宜補氣為主次宜安胎若云諸症不宜補者此醫家大誤事也孕婦厭食嘔吐此因氣虛不得流通便化為痰涎多聚於胃故有此症宜補氣祛痰為主白朮川貝各三錢茯苓前胡各二錢旋覆花香附殼砂陳皮各一錢妊婦漏胎下血竟如月水若待血乾非但損子亦損其母熟地白朮薑炭茯苓各二錢條芩二錢歸身殼砂阿膠各一錢妊婦腹中煩悶者氣血兩虛故也心肺兩經火動名為子煩條芩麥冬白朮茯苓芍藥各二錢知母防風前胡各一錢孕婦尿澀小便小道熱痛者名子淋冬葵子木通粉草各一錢條芩芍藥赤茯苓各二錢孕婦腹中胎鳴因懸高而胎失氣管故有此症名子鳴川芎三錢川連二錢妊婦小便頻鳴名為轉胞氣虛血熱也人參茯苓條芩各二錢歸身川芎芍藥粉草各一錢妊婦遍身浮腫脾胃氣虛茯苓澤瀉白朮各二錢木通豬苓厚朴各一錢妊婦二三月期心腹腰痛難忍氣熱腎虛故也六味加條芩三錢當歸阿膠甘草各一錢妊婦遍身疼痛氣血兩虛痰涎作痛人參加柴胡前胡川貝生薑妊婦寒熱不快者亦氣血兩虛故也逍遙散加條芩殼砂生薑妊婦傷寒恐熱極損胎必先安胎後隨症治之先用條芩殼砂後用本症之藥切忌薑桂麻黃辛熱之物妊婦痢疾必先用條芩殼砂以安胎次隨症治之須忌檳榔枳殼恐其下胎則病難治須用仔細妊婦泄瀉虛寒因久痢之後故有此症五苓散加良薑凡妊婦服藥雖有諸症條芩殼砂必不可少黃芩安胎清三焦之火能降血下行殼砂安胎乃血中之要藥又能止痛行氣阿膠安胎乃止血養血之藥治血虛胎動妊婦小産與小産不同小産損傷胎氣不比大産瓜熟蒂圓出於自然以補中益氣為主小産之後雖有諸症必因氣血虛寒而起宜補氣血以十全大補湯為主或人參湯加阿膠艾葉好冬葵子五錢枳殼木通蟬蛻各二錢車前子五錢歸尾三錢難産方蟬蛻蛇蛻龜甲各三錢新瓦焙乾為末好酒下之立下子死腹中用牯牛糞炒為末入醋半盞調以青布包好於臍上尉之立下妊婦血暈不論大小産皆有此症大補氣血為主然大産小産不同小産多因氣血兩虛而致其大産因敗血流入肝經致眼目黑暗頭目旋暈宜破血為主當先以烈火一盆置病人口鼻之下將好醋一鍾傾入火內使氣入其口鼻之中其神乃定而神自醒也後隨症治之有下血過多而暈者以人參湯有用心使力多而暈者以防風通聖散加四物治之産後諸症産後血暈敗血沖肝也山楂三錢紅花二錢桃仁官桂香附良薑莪朮各一錢産後頭痛發熱口乾飽悶出汗者由飲食過多也以消食祛風為主數日內治山楂三錢莪朮天麻桔梗陳皮麥芽紅花各一錢黑乾薑八分産後作寒作熱血入心肺則熱血入脾胃則寒寒熱相生故也認為瘧治者非也三稜莪朮紅花桃仁各二錢官桂黑乾薑各一錢山楂三錢産後四肢浮腫因敗血走注五臟傳流四肢不能運化或因飲食傷脾故也以水腫治之非也宜五苓散加三稜莪朮二錢山楂三錢月內加桃仁紅花黑姜不必多用産後癲狂如見鬼神狂言無度敗血熱血衝心如有所觸勿作風邪山楂官桂各三錢木香香附黑姜各一錢紅花桃仁各二錢産後泄瀉不止者多因誤食生冷堅硬之物與惡血相搏流注大腸不能克化也三稜莪朮紅花桃仁黑乾薑山楂加五苓散夫産後泄瀉多有不同或因難産之後氣血兩虛而泄瀉者瀉久則寒或因寒氣所侵而瀉者久則必虛其治法相同五苓散加三稜莪朮山楂或因瘀血流入大腸而泄瀉者黑姜官桂山楂紅花桃仁上二症泄久與虛寒症同治醫須仔細一有誤十不能救一也産後泄瀉水穀不化糞門不閉此虛寒極也不論久近治法一同人參五分白朮茯苓肉桂黑姜各二錢豬苓澤瀉各一錢産後泄瀉腹中作痛大便急澀者亦瘀血入大腸也若久遠以虛寒治之黑姜官桂紅花各二錢三稜莪朮各一錢桃仁産後百節疼痛由産後骨節開張因冒風寒敗血不行流入經絡停聚不散也紅花桃仁各二錢歸尾黑乾薑官桂烏藥秦艽各一錢産後小便尿血色如雞肝者因産後調理失宜惱怒傷肝心二經流入小腸也若流入大腸必大腸阻難也紅花桃仁丹皮各二錢木香桔梗木通香附各一錢産後胸脹氣滯嘔逆不定因飲食過多聚於胃中與痰結聚成塊上喘氣急四肢寒熱口乾心悶睡臥多驚日近者用山楂三錢烏藥二錢砂仁麥芽川貝母陳皮香附黑乾薑各一錢日遠者用三稜莪朮前胡檳榔柴胡各一錢砂仁二錢産後喉中如蟬鳴因惱怒所致敗血衝心轉入肺經敗血與氣結聚成塊入於喉中若患此症十難救一肉桂紅花桃仁良薑各二錢木通烏藥陳皮各一錢産後泄瀉胸膈飽悶泄瀉不常此食積也三稜莪朮一錢山楂殼砂黑乾薑官桂各二錢若久遠以虛寒治之有糞渣可治如屋漏黑水必死無疑産後最忌泄瀉務必謹慎産後面黃舌乾鼻中出血遍身斑點者敗血入於五臟六腑轉入肌膚熱結不行也十無一生紅花桃仁官桂丹皮各二錢莪朮木通羌活防風荊芥各一錢産後發熱頭痛手足不能伸縮者由産時失於謹慎多冒風邪也切不可作中風邪以發表劑抬之天麻秦艽川貝防風乾薑官桂蘇梗産後頭痛發熱腹中刺痛難忍因寒氣所侵敗血不行結聚成塊故也不論遠近同治山楂三錢乾薑肉桂烏藥吳萸香附玄胡紅花桃仁各二錢蘇梗一錢産後不言狂走石菖蒲麥冬防風天麻川芎川貝辰砂香附産後月外發熱發寒飲食不進腹中作痛因氣血兩虛也當歸芍藥川芎人參白朮茯苓香附産後月外喘促痰逆虛黃因飲食傷胃痰固其積也三稜莪朮厚朴官桂黑乾薑川貝陳皮桔梗香附産後月外寒熱不均因氣血兩虛故也甘草芍藥柴胡白朮當歸茯苓陳皮川芎香附産後月外虛汗不止因氣血虛而遇風邪也白朮茯苓二錢黃耆香附麥冬防風一錢官桂五分産後月外聲音不出嘔吐不止飲食不納陳皮白朮茯苓香附乾薑前胡黃耆産後諸症多因冒風寒為敗血作禍其乾薑紅花桃仁烏藥肉桂山楂香附必不可少治産之症妙在乾薑若大熱重用若微熱則輕用輕則一錢重則三錢須要酒炒得黑不黑不可用恐反生火産後月外氣血已定已歸經絡雖有諸症宜大補氣血又宜活血而諸書以芍藥為産後最忌殊不知月外諸症非芍藥不能收功誠恐不信談論特備其要以俟違者鑑之産後月內口眼歪斜角弓反張不能伸縮此係産時冒風邪所致而發熱頭疼者宜用此方天麻貝母秦艽歸身官桂蘇梗乾薑月外犯之亦不可作中風治皆因氣血兩虛甚宜補氣血隨即祛痰為要産後發熱惡寒月內當逐惡露為要月外各歸經絡氣血兩分既定而犯此症是氣血虛極其左手脈不足補血倍於補氣右手脈不足補氣倍於補血切不可發表倘因飲食不節而犯此症月內以逐惡露之藥加山楂麥芽砂仁貝母陳皮月外以調氣補血為主加山楂麥芽消食行痰之藥為要最忌發表藥産後口眼喎斜手足頑麻半身不遂皆因不謹慎或誤下生水或冒風邪所致應在半年數月外發之切不可作風邪鬼箭等症誤用針刺並不可發表如有一失不可救矣宜服此方紅花花粉二錢防風荊芥獨活當歸秦艽羌活牛膝白朮沙參茯苓川芎各二錢木香八分加燈草老酒煎服先服四帖如不愈加桑寄生二錢肉桂八分服二帖即痊可加天麻二錢妙安胎逐月主方補一月名胎胚足厥陰肝管胎此經少氣多血二月足少陽膽管胎若始膏此經氣多血少三月名始胎手少陰心管胎此經少血多氣歸身茯神黃芩時寒少用殼砂時寒多用杜仲棗仁白朮肉桂形體成四個月命門相火管胎手少陽三焦去棗仁茯神加熟地三錢始受水精以行血脈此經氣多血少能動五個月太陰脾經管胎去肉桂加白朮二錢始受火精以成其氣此經少血多氣筋骨立六個月陽明胃經管胎加人參五分如肺虛加數倍可也始受金精以成其筋此經氣盛血少毛髮生七個月太陰肺經管胎減砂仁至三分加黃芩至二錢始受木精以成其骨此經少血多氣臟腑具八個月陽明大腸管胎加人參錢半始受土精以成膚此經氣盛血多穀氣入胃九個月少陰腎經管胎原方不用用寬胎散始受石精以成毛髮此經少血多氣歸身益母草川芎枳殼杜仲諸神備十個月太陽膀胱管胎同前九個月方臨盆用催生散臟腑關節人神具備此經少氣多血當歸枳殼香附益母草川芎陳皮紅花白芷奇方産後一二日間痢疾並心痛赤芍山楂歸尾牛膝陳皮肉桂劉寄奴薑炭川芎香附桃仁去衣各一錢日一劑如有乳毒加白芷産後五六日發熱不思飲食有似傷寒等症赤芍桃仁歸尾陳皮甘草山楂肉枳殼香附玄胡乾薑肉桂加白芷末藥方劉奇奴山楂香附棉花子烏豆俱炒為末香附易玄胡加荊芥尤妙砂仁湯送二錢四物湯加減法古方四物芎歸芍地黃女科諸病是良方調理養血醫虛損胎産無如用此湯參朮苓甘名八物氣虛血弱功最捷十全加了桂黃耆大補真元與精血若對參蘇號補心心虛血少夢中驚産後感寒能服此不須加減效如神下午發熱本陰虛方加知柏可痊除骨蒸勞熱紫耆鱉知柏能兼地骨皮婦人經水適然來似瘧湯中加小柴妊娠月水時時下膠艾加之止漏胎經水過期陰血少本方加桔與參耆腹內積氣當為痛香附莪稜服自行月經紫色及先期方入芩連並牡皮小腹瘀經兜澀痛桃紅烏附莫教遲瘦婦血枯經澀閉本方增入桃仁治肥人色淡屬於痰配合二陳成一劑經血行來太去多芩連柴柏可同科更加荊芥與羌活升提其氣要安和方加芩術善安胎胎痛砂蘇郁便用腹大異常成水病心胸氣逆如鼓硬鯉魚湯煎苓朮芩減地芎加姜桔應胎氣不安胸隔脹枳桔加之即宣暢孕婦心煩號子煩芩麥茯苓為依傍芎歸二味佛手名坐草忙煎可保生若是難産生不下草霜白芷一同行焦姜能治産後熱甘草大芎補陰血汗多方內減川芎急服參耆防氣脫産後血迷成血暈惡露去多精神困澤蘭芎歸荊參草散號清魂能定暈黑神減芎入桂姜炙甘黑豆炒蒲黃淨露下胸除腹滿酒便調服效非常産後惡露如何少若無別症精神好驀然寒熱腹中疼還是黑神真個妙産後驚風血不來肚疼發熱脹難捱柴胡佛手靈脂澤羌活紅花仔細排産後須當四物湯但凡初産配焦姜産初用芍傷生氣膩膈尤嫌熟地黃腸滑地歸當應忌汗多須把川芎去血虛腹痛赤芍良加減四物先賢祕十全濟陰丸歸身酒洗熟地香附酒煮四兩山藥白朮二兩五錢杞子人參二兩蘄艾葉二兩去筋梗同香附酒醋煮一時搗焙川芎白芍丹皮紫石英火煅碎各一兩五錢澤蘭一兩紫河車一具用銀針刺去紫筋酒洗淨白上藥切片同河車入沙鍋內用陳老酒三碗陳米醋一碗清白童便一碗米泔水數碗和勻浮藥寸許密蓋不透桑木火慢煮以河車融化汁干為度取出同搗極爛捏作餅日曬夜露三晝夜宜在月滿之時以受日精月華仍焙乾為末搗爛蜜丸如梧子每服五十丸空腹淡鹽湯下隨用早飯使藥下行忌食生蘿蔔凡月經過期或少或不行皆血寒血少也尺脈必微弱加桂心五錢夏三錢黃耆一兩炙先期血熱也脈來必數加條芩二兩酒炒生地一兩五錢酒炒腹痛加芍藥一兩酒炒將行而先作痛者血實而氣滯也成塊者氣凝也脈來弦數滑大加延胡一兩酒炒陳皮八分木香柴胡梢五錢行後作痛者氣血俱虛也尺脈必虛澀而兼緊加黑姜三錢白茯苓一兩桂心五錢夏三錢三五日後腹中綿綿作痛者或淋瀝不止血因氣滯未盡也尺脈見沉澀或沉弦加木香五錢柴胡六錢紫色或黑色血熱之甚也尺脈見洪數加條芩黃柏各一兩炒生地一兩五錢灑浸過期色淡肥人則有濕痰加茯苓蒼朮米泔淡鹽水炒陳皮各一兩白朮五錢減熟地一兩瘦人則血虛少而水混之加桂心五錢或來或斷或發寒熱者加柴胡八錢白茯苓一兩凡經不調多白帶者肥人主胃中濕痰流注加製蒼朮白茯苓一兩五錢減熟地一兩凡瘦人氣多血少脾虛加木香五錢牡蠣煅赤石脂煅白茯苓各一兩凡多崩漏者減香附艾葉各一兩加荊芥穗炒一兩黃芩一兩五錢血崩者或多加阿膠一兩黑姜五錢黃耆一兩炙元氣虛弱經水閉者加牛膝二兩屬寒加桂心五錢屬熱加黃芩一兩酒炒凡婢妾多忌於嫡者必多抑鬱以致經水不調者加法制香附二兩或血弱心虛交感時驚恐不寧則精氣不聚加琥珀另研棗仁隔砂略炒茯神各一兩辰砂飛紫石英各五錢此方十年不育者皆主之調經方臨期服三帖烏附芍芎歸桃仁索桂茴當歸三錢撫芎紅花酒炒小茴香附酒洗炒赤芍各一錢烏藥一錢延胡二錢醋炒桃仁去皮尖四錢赤桂五分酒炒姜三片燈心十根經前服經期後方四物杜續苓斛砂姜當歸一錢熟地一錢芍藥二錢酒炒杜仲二錢茯苓一錢石斛一錢川芎一錢川斷一錢五分砂仁五分煨姜一大片棗三枚半飢飽服丸藥方地歸杜續苓斛故菟車蓉熟地當歸杜仲川斷故紙菟絲各四兩肉蓯蓉二兩茯苓二兩石斛三兩河車一具産後總論凡經胎諸症皆起於氣血衰脾胃虛而産後之氣血至脾胃虛衰尤甚是以丹溪論産當以大補氣血為主雖有他症以末治之夫産後憂驚勞倦血氣暴虛諸症乘虛易入如有氣母專耗散如有食母專消導熱不可用芩連寒不可用桂附寒則血氣停滯熱則新血流崩至如中外感見三陽表症多似可汗也在産後而用麻黃則重竭其陽見三陰里症多似可下也在産後而用承氣則重竭其陰耳識脅痛如腎虛惡露之停休用柴胡譫語汗出乃元弱似邪之症毋同胃實厥有陽氣之衰難分寒熱非大補不能回陽而起弱痊由陰血之虧毋論剛柔非滋榮不能舒筋而活絡又如乍寒乍熱發作有時症似瘧也若以瘧治遷延難愈神不守舍言論無序病似邪也若以邪論危可立待去血多而大便燥結蓯蓉加於生化非潤腸順氣之能通患汗多而小便短澀六君倍用參耆必生津助液之可利加參於生化頻服救産後之危長生活命屢用蘇絶谷之人㿗疝脫肛多是元虛下陷須用補中益氣口噤拳攣如因血燥類風還仗生化加參産戶入風而痛甚宜服羌活養榮玉門傷冷而不閉須選蛇菟萸硫怔仲驚悸生化湯堪加定志似邪恍惚安神丸助用歸脾因氣而滿悶虛損生化加木香為佐因食而噯酸惡食六君加曲麥為良氣短者人參生化杏核氣短而汗出者再加浮麥麻根若內虛弱而外感深人參寧肺堪用咳嗽者生化杏桔知母痰嗽而汗出者還增半棗參耆若干咳嗽而大熱甚加減四物尤宜泄瀉而塊痛已無酌用參耆肉果訶子痢疾而後重如甚急煎木香白茯苓陳皮乳癰腫痛制立兩方未膿栝蔞乳沒已膿大補金花嘔吐絶谷分為兩症氣滯加減六和血滯安胃行血須知蘇木稜莪大能破血青皮枳實最消脹滿要識耗氣破血之劑損傷榮衛止可施子少壯豈宜用於胎産大抵新産之後須問惡露何如塊痛未除不可遽加耆術腹中痛止補中益氣無疑至如陽亡脫汗氣虛喘促須服加參生化是從權也又如陽亡大熱血崩厥暈速煎生化原方乃急救也治法當遵丹溪而固本服法宜效太僕而加頻生化湯論一産後氣血暴虛理宜大補但惡露未盡用補須兼行滯能化又能生攻塊無損元氣行中又兼補始得萬全以四物湯理産誤人多矣地黃性寒滯血白芍酸寒無補故也一産後有塊痛名兒枕世多專先耗散後議補又立消補混方殊不知舊血須消化新血當生養若專攻舊生亦不寧世以濟坤丹又名回生丹治産用以攻血塊下胞落胎雖見速效其元氣未免虧損平安産婦莫視良劑不得已用一丸可矣不必多服一生化湯因藥性功用而名也夫産後血塊當消新血宜生若專消則新血不寧如專生則舊血交滯考諸藥性惟芎歸桃仁善破舊血驟生新血佐以炮姜甘草引入肝肺生血利氣行中有補化中有生實産後妙方也生化湯當歸八錢川芎三錢桃仁去皮尖十五粒黑姜炙甘草各五分一本有陳皮煎好入酒七匙帶熱服要在一二時內未進飲食前連進三服服多而頻則瘀速化而驟生新血自免暈症若胎前稟弱及産後勞倦又當再服兩帖以防危倦且産婦服一帖精神漸增自不厭服藥之多若照常間服一帖只能扶危若虛人見危症又熱症墜胎或勞甚身潮頭痛服至四五帖必安矣如血痛又當再服凡將産時預製二三帖至胞衣一破速煎一帖候見下地即服不問正産半産雖少壯産婦平安無恙宜服兩帖以消塊生養新血新産及三日內服生化湯兩三日痛塊未除再服七日內血塊未除不可加參耆術致痛不止
